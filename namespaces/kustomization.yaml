apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Wave 0. Namespaces and their PSA labels must exist before anything is
# admitted into them — a pod applied to a namespace whose labels arrive a
# moment later is admitted unchecked, and nothing afterwards re-evaluates it.
resources:
  - ns-zt-prod.yaml
  - ns-zt-attack.yaml
  - ns-zt-psa-off.yaml
