apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Wave 4 — LAST, and that is the single most important ordering decision in
# the repository.
#
# Every preceding wave is a control: namespaces with PSA labels (0), admission
# policy (1), network policy (2), mesh policy (3). The workloads arrive into a
# namespace where all four are already in force, so the first pod ever admitted
# is evaluated by the complete set.
#
# Deploy the workloads earlier and they are admitted unchecked. Nothing
# re-evaluates them afterwards — verifyImages runs only at admission, and it
# has to (background: false is mandatory for it) — so those pods keep running
# unverified until something restarts them. The cluster would then report every
# policy applied and healthy while the workloads in it had never been through
# any of them.
#
# A caveat carried over from the previous project, where it was measured rather
# than assumed: SYNC WAVES ORDER CREATION, NOT SUCCESS. An Application whose
# manifests fail validation sits in `Unknown`, which does not block later waves
# the way `Progressing` does. So the guarantee above holds when the earlier
# waves are HEALTHY and not merely attempted. scripts/03-verify-enforcement.sh
# checks the controls functionally for exactly this reason.
resources:
  - api.yaml
  - web.yaml
